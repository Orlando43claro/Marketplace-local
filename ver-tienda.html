<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | YaMi</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/CRZNPpf/1770824892177.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ff6b00; --oscuro: #232f3e; --gris: #f0f2f5; --verde: #25d366; --azul: #2196f3; --oro: #ffb100; --rojo: #d91e18; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding-top: 85px; overflow-x: hidden; }

        /* AVISO DE TIENDA EN PAUSA */
        #bloqueo-aviso { 
            display: none; 
            background: var(--rojo); 
            color: white; 
            text-align: center; 
            padding: 10px; 
            font-size: 12px; 
            font-weight: bold; 
            position: fixed; 
            top: 70px; 
            width: 100%; 
            z-index: 900; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header { background: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--naranja); background: #eee; }
        .logo-text h1 { margin: 0; font-size: 16px; color: var(--oscuro); font-weight: 900; }
        .logo-text span { font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        .cart-icon { position: relative; background: var(--oscuro); color: white; width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .cart-count { position: absolute; top: -5px; right: -5px; background: var(--naranja); color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; }

        .container { max-width: 500px; margin: auto; padding: 15px; }

        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0 15px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: white; padding: 8px 18px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1.5px solid #edf2f7; color: #64748b; transition: 0.3s; }
        .cat-btn.active { background: var(--naranja); color: white; border-color: var(--naranja); box-shadow: 0 4px 12px rgba(255,107,0,0.2); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.04); transition: 0.3s; border: 1px solid #f1f5f9; position: relative; }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; }
        .product-info { padding: 12px; }
        .product-name { font-size: 13px; font-weight: 700; color: var(--oscuro); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 34px; }
        .product-price { color: var(--naranja); font-weight: 900; font-size: 15px; margin-bottom: 10px; display: block; }
        .add-btn { width: 100%; background: var(--oscuro); color: white; border: none; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.3s; }

        /* MODAL */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; box-sizing: border-box; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 30px; overflow: hidden; animation: slideUp 0.3s ease; position: relative; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .modal-info { padding: 25px; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; z-index: 10; }

        /* CARRITO */
        .cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 3000; padding: 25px; box-sizing: border-box; max-height: 85vh; overflow-y: auto; }
        .cart-panel.active { transform: translateY(0); }
        .cart-item { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .cart-item img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
        .order-btn { background: var(--verde); color: white; width: 100%; border: none; padding: 16px; border-radius: 18px; font-size: 15px; font-weight: 800; margin-top: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        #btn-flotante-w { position: fixed; bottom: 20px; right: 20px; background: var(--verde); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 25px rgba(37,211,102,0.4); cursor: pointer; z-index: 999; }
    </style>
</head>
<body>

<div id="bloqueo-aviso">⚠️ ESTA TIENDA ESTÁ EN PAUSA TEMPORAL</div>

<header>
    <div class="logo-box">
        <img id="logo-tienda" src="" class="logo-img">
        <div class="logo-text">
            <h1 id="nombre-tienda">Cargando...</h1>
            <span>Tienda Verificada</span>
        </div>
    </div>
    <div class="cart-icon" onclick="toggleCart()">
        <i class="fas fa-shopping-bag"></i>
        <div id="cart-count" class="cart-count">0</div>
    </div>
</header>

<div class="container">
    <div id="cat-list" class="categories">
        <div class="cat-btn active" onclick="filterCat('Todas', this)">Todas</div>
    </div>
    <div id="product-grid" class="grid"></div>
</div>

<div id="modal-product" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <div class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></div>
        <img id="m-img" class="modal-img">
        <div class="modal-info">
            <h2 id="m-nombre" style="margin:0; font-size:20px;"></h2>
            <span id="m-precio" style="color:var(--naranja); font-weight:900; font-size:24px; display:block; margin:10px 0;"></span>
            <p id="m-desc" style="color:#64748b; font-size:14px; line-height:1.6; margin-bottom:25px;"></p>
            <button class="order-btn" id="add-to-cart-modal" style="background:var(--oscuro);">
                <i class="fas fa-plus"></i> AÑADIR AL PEDIDO
            </button>
        </div>
    </div>
</div>

<div id="cart-panel" class="cart-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0; font-size:20px;">Mi Pedido</h2>
        <i class="fas fa-times" onclick="toggleCart()" style="font-size:20px; cursor:pointer;"></i>
    </div>
    <div id="cart-items"></div>
    <div style="margin-top:20px; padding-top:20px; border-top:2px solid #f1f5f9;">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:900; font-size:18px;">
            <span>Total:</span>
            <span id="cart-total">$0</span>
        </div>
        <label style="font-size:11px; font-weight:800; color:#94a3b8; text-transform:uppercase;">Notas adicionales:</label>
        <textarea id="order-notes" style="width:100%; border:1.5px solid #edf2f7; border-radius:12px; padding:12px; margin-top:5px; font-family:inherit;" placeholder="Talla, color o dirección..."></textarea>
        <button class="order-btn" onclick="sendOrder()">
            <i class="fab fa-whatsapp"></i> ENVIAR PEDIDO POR WHATSAPP
        </button>
    </div>
</div>

<a id="btn-flotante-w" href="" target="_blank"><i class="fab fa-whatsapp"></i></a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
        authDomain: "express-market-868d9.firebaseapp.com",
        projectId: "express-market-868d9",
        storageBucket: "express-market-868d9.firebasestorage.app",
        messagingSenderId: "502987186701",
        appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('id');

    let allProducts = [];
    let cart = [];
    let storeDocId = null;
    let storeData = null;
    let isBlocked = false;
    let currentProduct = null;
    
    // VARIABLE CERROJO PARA EL CONTADOR (EVITA INCREMENTO DOBLE)
    let clicsBloqueados = false;

    async function start() {
        if(!storeId) return;
        const q = query(collection(db, "socios"), where("celular", "==", storeId));
        const snap = await getDocs(q);
        
        if(!snap.empty) {
            storeDocId = snap.docs[0].id;
            storeData = snap.docs[0].data();
            isBlocked = (storeData.plan === "gratis" && storeData.bloqueado);
            
            document.getElementById('nombre-tienda').innerText = storeData.nombreTienda;
            document.getElementById('logo-tienda').src = storeData.fotoPerfil || '';
            document.getElementById('btn-flotante-w').href = `https://wa.me/${storeId}`;
            
            if(isBlocked) document.getElementById('bloqueo-aviso').style.display = 'block';

            // Incrementar Visita (Solo una vez por carga de página)
            await updateDoc(doc(db, "socios", storeDocId), { visitas: increment(1) });

            loadProducts();
            loadCategories();
        }
    }

    function loadCategories() {
        onSnapshot(collection(db, "categorias"), (snap) => {
            const list = document.getElementById('cat-list');
            list.innerHTML = '<div class="cat-btn active" onclick="filterCat(\'Todas\', this)">Todas</div>';
            snap.forEach(d => {
                list.innerHTML += `<div class="cat-btn" onclick="filterCat('${d.data().nombre}', this)">${d.data().nombre}</div>`;
            });
        });
    }

    function loadProducts() {
        const q = query(collection(db, "productos"), where("waVendedor", "==", storeId));
        onSnapshot(q, (snap) => {
            allProducts = [];
            snap.forEach(d => allProducts.push({id: d.id, ...d.data()}));
            renderProducts(allProducts);
        });
    }

    function renderProducts(arr) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';
        arr.forEach(p => {
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
            grid.innerHTML += `
                <div class="product-card" style="${isBlocked ? 'filter:grayscale(1); pointer-events:none;' : ''}">
                    <img src="${p.imagen}" class="product-img" onclick="openModal('${encoded}')">
                    <div class="product-info">
                        <span class="product-name">${p.nombre}</span>
                        <span class="product-price">$${Number(p.precio).toLocaleString()}</span>
                        <button class="add-btn" onclick="addToCartDirect('${encoded}', this)">AÑADIR AL PEDIDO</button>
                    </div>
                </div>`;
        });
    }

    window.filterCat = (cat, btn) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = cat === 'Todas' ? allProducts : allProducts.filter(p => p.categoria === cat);
        renderProducts(filtered);
    }

    window.openModal = (encoded) => {
        const p = JSON.parse(decodeURIComponent(escape(atob(encoded))));
        currentProduct = p;
        document.getElementById('m-img').src = p.imagen;
        document.getElementById('m-nombre').innerText = p.nombre;
        document.getElementById('m-precio').innerText = `$${Number(p.precio).toLocaleString()}`;
        document.getElementById('m-desc').innerText = p.descripcion || '';
        document.getElementById('modal-product').style.display = 'flex';
    }

    window.closeModal = () => document.getElementById('modal-product').style.display = 'none';

    // FUNCIÓN DE INCREMENTO DE INTERESADOS (CORREGIDA DE 1 EN 1)
    window.addToCartDirect = async (encodedData, btn) => {
        if(isBlocked || clicsBloqueados) return;
        clicsBloqueados = true; // ACTIVAR CERROJO

        const p = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
        cart.push(p);
        updateCartUI();

        if(storeDocId) {
            try {
                // INCREMENTO ESTRICTO DE 1 USANDO FIREBASE INCREMENT
                await updateDoc(doc(db, "socios", storeDocId), { clics: increment(1) });
            } catch (e) { console.error(e); }
        }

        btn.innerText = "¡AÑADIDO!";
        btn.style.background = "#25d366";
        
        // LIBERAR CERROJO DESPUÉS DE 2 SEGUNDOS
        setTimeout(() => { 
            btn.innerText = "AÑADIR AL PEDIDO"; 
            btn.style.background = "#232f3e"; 
            clicsBloqueados = false; 
        }, 2000);
    }

    document.getElementById('add-to-cart-modal').onclick = async () => {
        if(isBlocked || clicsBloqueados) return;
        clicsBloqueados = true;

        cart.push(currentProduct);
        updateCartUI();
        
        if(storeDocId) {
            await updateDoc(doc(db, "socios", storeDocId), { clics: increment(1) });
        }
        
        closeModal();
        setTimeout(() => { clicsBloqueados = false; }, 2000);
    };

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
        const list = document.getElementById('cart-items');
        list.innerHTML = '';
        let total = 0;
        cart.forEach((item, index) => {
            total += Number(item.precio);
            list.innerHTML += `
                <div class="cart-item">
                    <img src="${item.imagen}">
                    <div style="flex:1">
                        <div style="font-size:13px; font-weight:700;">${item.nombre}</div>
                        <div style="color:var(--naranja); font-weight:900;">$${Number(item.precio).toLocaleString()}</div>
                    </div>
                    <i class="fas fa-trash" onclick="removeFromCart(${index})" style="color:#cbd5e1; cursor:pointer;"></i>
                </div>`;
        });
        document.getElementById('cart-total').innerText = `$${total.toLocaleString()}`;
    }

    window.removeFromCart = (index) => { cart.splice(index, 1); updateCartUI(); }
    window.toggleCart = () => document.getElementById('cart-panel').classList.toggle('active');

    window.sendOrder = async () => {
        if(isBlocked || cart.length === 0) return;

        let m = `*PEDIDO DESDE YAMI - ${storeData.nombreTienda.toUpperCase()}*%0A%0A`;
        let t = 0;
        cart.forEach(i => { m += `• ${i.nombre} ($${Number(i.precio).toLocaleString()})%0A`; t += Number(i.precio); });
        const n = document.getElementById('order-notes').value;
        if(n) m += `%0A*Nota:* ${n}%0A`;
        m += `%0A*TOTAL A PAGAR: $${t.toLocaleString()}*%0A%0A_¿Están disponibles?_`;
        window.open(`https://wa.me/${storeId}?text=${m}`, '_blank');
    }

    start();
</script>

<div style="text-align: center; padding: 25px 20px; background: #ffffff; border-top: 1px solid #f0f2f5; margin-top: 40px;">
    <div style="margin-bottom: 8px; opacity: 0.7;">
        <i class="fas fa-user-lock" style="font-size: 12px; color: #64748b;"></i>
        <span style="font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;"> Compras Seguras</span>
    </div>
    <a href="condiciones.html" style="font-size: 10px; color: var(--azul); text-decoration: none; font-weight: bold;">Términos y Condiciones</a>
</div>
</body>
</html>
