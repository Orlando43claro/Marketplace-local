<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda | YaMi</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/CRZNPpf/1770824892177.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--naranja:#ff6b00;
--oscuro:#232f3e;
--gris:#f0f2f5;
--azul:#2196f3;
--oro:#d4af37;
--rojo:#d91e18;
}

body{
font-family:'Segoe UI',sans-serif;
background:var(--gris);
margin:0;
padding-top:95px;
}

/* HEADER */
header{
background:white;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
width:100%;
box-shadow:0 4px 15px rgba(0,0,0,.05);
z-index:1000;
}

.back-btn{
background:none;
border:none;
font-size:18px;
cursor:pointer;
margin-right:10px;
color:var(--oscuro);
}

.store-logo{
width:50px;
height:50px;
border-radius:50%;
border:3px solid var(--naranja);
object-fit:cover;
}

.store-name{
font-weight:800;
font-size:16px;
}

.badge-pro{
background:var(--oro);
color:white;
font-size:11px;
padding:4px 10px;
border-radius:20px;
margin-top:4px;
display:inline-block;
font-weight:700;
}

.badge-gratis{
background:#ddd;
color:#333;
font-size:11px;
padding:4px 10px;
border-radius:20px;
margin-top:4px;
display:inline-block;
font-weight:700;
}

/* GRID 2 COLUMNAS */
.container{
max-width:900px;
margin:auto;
padding:20px 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-body{
padding:12px;
}

.p-name{
font-weight:700;
font-size:14px;
height:36px;
overflow:hidden;
}

.p-price{
color:var(--naranja);
font-weight:900;
margin-top:5px;
}

.btn-add{
margin-top:8px;
width:100%;
background:var(--naranja);
color:white;
border:none;
padding:8px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

/* CARRITO */
.cart-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:var(--oscuro);
color:white;
padding:12px 20px;
border-radius:50px;
display:none;
justify-content:space-between;
align-items:center;
width:90%;
max-width:420px;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
justify-content:center;
align-items:flex-end;
z-index:3000;
}

.modal-content{
background:white;
width:100%;
max-width:600px;
border-radius:25px 25px 0 0;
padding:20px;
max-height:85vh;
overflow-y:auto;
}

.close-btn{
text-align:right;
font-size:14px;
cursor:pointer;
color:#666;
margin-bottom:10px;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:8px;
font-size:14px;
}

.remove{
color:var(--rojo);
cursor:pointer;
font-size:12px;
margin-left:10px;
}

textarea{
width:100%;
margin-top:15px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
resize:none;
}

.btn-whatsapp{
width:100%;
margin-top:15px;
background:var(--naranja);
color:white;
border:none;
padding:12px;
border-radius:50px;
font-weight:800;
cursor:pointer;
}

/* TOAST */
#toast{
position:fixed;
top:100px;
left:50%;
transform:translateX(-50%);
background:white;
padding:10px 20px;
border-radius:30px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
display:none;
font-size:13px;
font-weight:bold;
}
</style>
</head>

<body>

<div id="toast"></div>

<header>
<div style="display:flex;align-items:center;gap:10px;">
<button class="back-btn" onclick="window.location.href='index.html'">
<i class="fas fa-arrow-left"></i>
</button>

<img id="logo-img" class="store-logo" src="">
<div>
<div id="store-name" class="store-name">Cargando tienda...</div>
<div id="badge-container"></div>
</div>
</div>
</header>

<div class="container">
<div id="productos-grid" class="grid"></div>
</div>

<div id="cart-bar" class="cart-bar" onclick="openCart()">
<div><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></div>
<div>$ <span id="cart-total">0</span></div>
</div>

<div id="cart-modal" class="modal">
<div class="modal-content">

<div class="close-btn" onclick="closeCart()">Cerrar ✕</div>

<h3>Tu Lista</h3>
<div id="cart-items"></div>
<h4>Total: $ <span id="modal-total">0</span></h4>

<textarea id="pregunta" rows="3" placeholder="Haz una pregunta al vendedor..."></textarea>

<button class="btn-whatsapp" onclick="enviarPedido()">
Preguntar por WhatsApp
</button>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 TU FIREBASE ORIGINAL INTACTO */
const firebaseConfig = {
    apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
    authDomain: "express-market-868d9.firebaseapp.com",
    projectId: "express-market-868d9",
    storageBucket: "express-market-868d9.firebasestorage.app",
    messagingSenderId: "502987186701",
    appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const storeId = urlParams.get('id');
let cart = [];
let storeData = null;

function toast(text){
const t=document.getElementById('toast');
t.innerText=text;
t.style.display='block';
setTimeout(()=>t.style.display='none',2000);
}

async function start() {
if (!storeId) return;

/* SOCIO */
const qSocio = query(collection(db,"socios"), where("celular","==",storeId));
const snapSocio = await getDocs(qSocio);

if (!snapSocio.empty) {
const docSocio = snapSocio.docs[0];
storeData = docSocio.data();

document.getElementById('store-name').innerText = storeData.nombreTienda;
document.getElementById('logo-img').src = storeData.fotoPerfil || 'https://via.placeholder.com/50';

/* SUMAR VISITA (original tuyo) */
await updateDoc(doc(db,"socios",docSocio.id), { visitas: increment(1) });

if(storeData.plan==="pro"){
document.getElementById('badge-container').innerHTML=
`<span class="badge-pro">
<i class="fas fa-check-circle" style="color:var(--azul)"></i>
Vendedor Verificado PRO
</span>`;
}else{
document.getElementById('badge-container').innerHTML=
`<span class="badge-gratis">Socio Vendedor</span>`;
}
}

/* PRODUCTOS */
const qProd = query(collection(db,"productos"), where("waVendedor","==",storeId));
const snapProd = await getDocs(qProd);
const grid = document.getElementById('productos-grid');
grid.innerHTML='';

snapProd.forEach(d=>{
const p=d.data();
grid.innerHTML+=`
<div class="card">
<img src="${p.imagen}" onerror="this.src='https://via.placeholder.com/150'">
<div class="card-body">
<div class="p-name">${p.nombre}</div>
<div class="p-price">$${Number(p.precio).toLocaleString()}</div>
<button class="btn-add" onclick="addToCart('${d.id}','${p.nombre}',${p.precio})">
Añadir a lista
</button>
</div>
</div>
`;
});
}

window.addToCart=(id,nombre,precio)=>{
if(cart.some(p=>p.id===id)){
toast("Este producto ya está agregado a la lista");
return;
}
cart.push({id,nombre,precio});
updateCart();
};

function updateCart(){
if(cart.length===0){
document.getElementById('cart-bar').style.display='none';
return;
}
document.getElementById('cart-bar').style.display='flex';
document.getElementById('cart-count').innerText=cart.length;
const total=cart.reduce((s,i)=>s+i.precio,0);
document.getElementById('cart-total').innerText=total.toLocaleString();
}

window.openCart=()=>{
document.getElementById('cart-modal').style.display='flex';
renderCart();
};

window.closeCart=()=>{
document.getElementById('cart-modal').style.display='none';
};

function renderCart(){
const container=document.getElementById('cart-items');
container.innerHTML='';
let total=0;

cart.forEach((i,index)=>{
container.innerHTML+=`
<div class="cart-item">
<span>${i.nombre}</span>
<div>
<span>$${Number(i.precio).toLocaleString()}</span>
<span class="remove" onclick="removeItem(${index})">Eliminar</span>
</div>
</div>
`;
total+=i.precio;
});

document.getElementById('modal-total').innerText=total.toLocaleString();
}

window.removeItem=(index)=>{
cart.splice(index,1);
renderCart();
updateCart();
};

window.enviarPedido=()=>{
let mensaje=`*Consulta desde YaMi - ${storeData.nombreTienda.toUpperCase()}*%0A%0A`;
cart.forEach(i=>{
mensaje+=`• ${i.nombre} ($${Number(i.precio).toLocaleString()})%0A`;
});
mensaje+=`%0A`;
const pregunta=document.getElementById('pregunta').value;
if(pregunta){
mensaje+=`Mensaje: ${pregunta}%0A`;
}
window.open(`https://wa.me/${storeId}?text=${mensaje}`,'_blank');
};

start();
</script>
</body>
</html>
