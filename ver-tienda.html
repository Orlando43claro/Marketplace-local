<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda | YaMi</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/CRZNPpf/1770824892177.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--naranja:#ff6b00;
--oscuro:#1e293b;
--gris:#f4f6f9;
--rojo:#d91e18;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(to bottom,#fff,var(--gris));
margin:0;
padding-top:90px;
}

header{
background:white;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
width:100%;
box-shadow:0 4px 20px rgba(0,0,0,.05);
z-index:1000;
}

.store-logo{
width:50px;
height:50px;
border-radius:50%;
border:3px solid var(--naranja);
object-fit:cover;
}

.store-name{
font-weight:800;
font-size:16px;
color:var(--oscuro);
}

.container{
max-width:650px;
margin:auto;
padding:20px 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border-radius:22px;
overflow:hidden;
box-shadow:0 6px 25px rgba(0,0,0,.06);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.card-body{
padding:14px;
}

.p-name{
font-weight:700;
font-size:14px;
height:36px;
overflow:hidden;
display:block;
}

.p-price{
color:var(--naranja);
font-weight:900;
font-size:16px;
margin-top:5px;
}

.btn-add{
margin-top:10px;
width:100%;
background:var(--naranja);
color:white;
border:none;
padding:8px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.cart-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:var(--oscuro);
color:white;
padding:14px 25px;
border-radius:60px;
display:none;
align-items:center;
gap:15px;
width:92%;
max-width:420px;
justify-content:space-between;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
justify-content:center;
align-items:flex-end;
z-index:3000;
}

.modal-content{
background:white;
width:100%;
max-width:600px;
border-radius:25px 25px 0 0;
padding:20px;
max-height:85vh;
overflow-y:auto;
}

.modal h3{
margin-top:0;
}

.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:8px;
font-size:14px;
}

textarea{
width:100%;
margin-top:15px;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
resize:none;
}

.btn-whatsapp{
width:100%;
margin-top:15px;
background:var(--naranja);
color:white;
border:none;
padding:12px;
border-radius:50px;
font-weight:800;
cursor:pointer;
}

.close{
text-align:right;
font-size:14px;
color:#888;
cursor:pointer;
margin-bottom:10px;
}
</style>
</head>

<body>

<header>
<div style="display:flex;align-items:center;gap:10px;">
<img id="logo-img" class="store-logo" src="">
<div>
<div id="store-name" class="store-name">Cargando tienda...</div>
</div>
</div>
<div style="font-weight:800;">YaMi</div>
</header>

<div class="container">
<div id="productos-grid" class="grid"></div>
</div>

<div id="cart-bar" class="cart-bar" onclick="openCart()">
<div>
<i class="fas fa-shopping-cart"></i>
<span id="cart-count">0</span> productos
</div>
<div>$ <span id="cart-total">0</span></div>
</div>

<!-- MODAL CARRITO -->
<div id="cart-modal" class="modal">
<div class="modal-content">
<div class="close" onclick="closeCart()">Cerrar ✕</div>
<h3>Tu Lista</h3>
<div id="cart-items"></div>
<h4>Total: $ <span id="modal-total">0</span></h4>

<textarea id="pregunta" rows="3" placeholder="Escribe una pregunta o mensaje para el vendedor..."></textarea>

<button class="btn-whatsapp" onclick="enviarPedido()">
Preguntar por WhatsApp
</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
authDomain:"express-market-868d9.firebaseapp.com",
projectId:"express-market-868d9",
storageBucket:"express-market-868d9.firebasestorage.app",
messagingSenderId:"502987186701",
appId:"1:502987186701:web:9fb3c28ce377fb27552b44"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const urlParams=new URLSearchParams(window.location.search);
const storeId=urlParams.get('id');

let cart=[];
let storeData=null;

async function start(){
if(!storeId) return;

const qSocio=query(collection(db,"socios"),where("celular","==",storeId));
const snapSocio=await getDocs(qSocio);

if(!snapSocio.empty){
storeData=snapSocio.docs[0].data();
document.getElementById('store-name').innerText=storeData.nombreTienda;
document.getElementById('logo-img').src=storeData.fotoPerfil||'https://via.placeholder.com/50';
}

const qProd=query(collection(db,"productos"),where("waVendedor","==",storeId));
const snapProd=await getDocs(qProd);
const grid=document.getElementById('productos-grid');

snapProd.forEach(d=>{
const p=d.data();
grid.innerHTML+=`
<div class="card">
<img src="${p.imagen}" onerror="this.src='https://via.placeholder.com/150'">
<div class="card-body">
<span class="p-name">${p.nombre}</span>
<span class="p-price">$${Number(p.precio).toLocaleString()}</span>
<button class="btn-add" onclick="addToCart('${d.id}','${p.nombre}',${p.precio})">
Añadir a lista
</button>
</div>
</div>
`;
});
}

window.addToCart=(id,nombre,precio)=>{
cart.push({id,nombre,precio});
updateCartUI();
};

function updateCartUI(){
const bar=document.getElementById('cart-bar');
if(cart.length>0){
bar.style.display='flex';
document.getElementById('cart-count').innerText=cart.length;
const total=cart.reduce((s,i)=>s+i.precio,0);
document.getElementById('cart-total').innerText=total.toLocaleString();
}
}

window.openCart=()=>{
document.getElementById('cart-modal').style.display='flex';
renderCart();
};

window.closeCart=()=>{
document.getElementById('cart-modal').style.display='none';
};

function renderCart(){
const container=document.getElementById('cart-items');
container.innerHTML='';
let total=0;

cart.forEach(i=>{
container.innerHTML+=`
<div class="cart-item">
<span>${i.nombre}</span>
<span>$${Number(i.precio).toLocaleString()}</span>
</div>
`;
total+=i.precio;
});

document.getElementById('modal-total').innerText=total.toLocaleString();
}

window.enviarPedido=()=>{
let mensaje=`*Consulta desde YaMi - ${storeData.nombreTienda}*%0A%0A`;
let total=0;

cart.forEach(i=>{
mensaje+=`• ${i.nombre} ($${i.precio})%0A`;
total+=i.precio;
});

mensaje+=`%0ATotal: $${total}%0A%0A`;
const pregunta=document.getElementById('pregunta').value;
if(pregunta){
mensaje+=`Mensaje: ${pregunta}%0A`;
}

window.open(`https://wa.me/${storeId}?text=${mensaje}`,'_blank');
};

start();
</script>
</body>
</html>
