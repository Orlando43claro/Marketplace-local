          <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas de la Semana | Express Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ff6b00; --oscuro: #232f3e; --gris: #f0f2f5; --verde: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding-top: 70px; }

        /* NAVBAR */
        nav { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--oscuro); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1000; }
        .brand-container { display: flex; align-items: center; }
        .logo-nav { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--naranja); margin-right: 10px; }
        .brand-name { color: white; font-size: 0.9rem; font-weight: bold; }
        .cart-icon { color: white; position: relative; cursor: pointer; font-size: 22px; }
        #cart-count { position: absolute; top: -5px; right: -8px; background: var(--naranja); color: white; font-size: 11px; padding: 2px 6px; border-radius: 50%; }

        /* BOTÓN FLOTANTE SOPORTE */
        .btn-soporte { position: fixed; bottom: 20px; right: 20px; background: var(--verde); color: white; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1500; text-decoration: none; transition: 0.3s; }
        .btn-soporte:active { transform: scale(0.9); }

        /* TOAST (NOTIFICACIÓN) */
        #toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 5000; width: 90%; max-width: 300px; }
        .toast-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-left: 5px solid var(--naranja); display: flex; align-items: center; gap: 10px; animation: slideDown 0.4s forwards; margin-bottom: 10px; font-size: 14px; }
        @keyframes slideDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }

        /* GRID Y TARJETAS */
        .container { padding: 8px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; border: 1px solid #eee; position: relative; }
        .card img { width: 100%; height: 140px; object-fit: contain; background: #fff; padding: 5px; box-sizing: border-box; cursor: pointer; }
        .stock-tag { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 3px 7px; border-radius: 5px; font-weight: bold; }
        .info { padding: 10px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0; font-size: 13px; color: var(--oscuro); height: 32px; overflow: hidden; cursor: pointer; }
        .price { font-size: 17px; font-weight: bold; color: #d91e18; margin: 5px 0; }
        .btn-card-add { background: var(--naranja); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* CARRITO LATERAL */
        #cart-sidebar { position: fixed; right: -100%; top: 0; width: 85%; max-width: 320px; height: 100%; background: white; z-index: 3000; transition: 0.4s; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.2); }
        #cart-sidebar.active { right: 0; }
        .cart-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .cart-items-list { flex: 1; overflow-y: auto; padding: 0 15px; }
        
        .cart-item { border-bottom: 1px solid #f0f0f0; padding: 15px 0; display: flex; flex-direction: column; gap: 8px; }
        .cart-item-info { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .cart-item-controls { display: flex; align-items: center; justify-content: space-between; }
        .qty-btns { display: flex; align-items: center; gap: 15px; background: #f0f2f5; padding: 5px 12px; border-radius: 20px; }
        .qty-btns button { border: none; background: none; font-size: 18px; color: var(--naranja); font-weight: bold; cursor: pointer; }
        .unit-price { font-size: 12px; color: #777; }

        .cart-footer { padding: 20px; border-top: 1px solid #eee; background: #fff; }
        input#client-name { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .cart-total-box { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .btn-wa { background: var(--verde); color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 10px; font-weight: bold; }

        /* MODAL */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 350px; border-radius: 15px; position: relative; overflow: hidden; animation: pop 0.3s forwards; }
        .modal-img { width: 100%; height: 250px; object-fit: contain; background: #fff; }
        .modal-body { padding: 20px; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<a href="https://wa.me/573155445183?text=Hola,%20tengo%20una%20consulta%20sobre%20los%20productos" class="btn-soporte" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<nav>
    <div class="brand-container">
        <img src="https://i.ibb.co/xS9z1Xhg/IMG-20260207-163949.jpg" class="logo-nav">
        <span class="brand-name">OFERTAS DE LA SEMANA</span>
    </div>
    <div class="cart-icon" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
    </div>
</nav>

<div class="container">
    <div class="grid" id="productos-container"></div>
</div>

<div id="product-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-data"></div>
    </div>
</div>

<div id="cart-sidebar">
    <div class="cart-header">
        <h3 style="margin:0">Mi Pedido</h3>
        <span style="font-size:28px; cursor:pointer;" onclick="toggleCart()">&times;</span>
    </div>
    <div class="cart-items-list" id="cart-items-list"></div>
    <div class="cart-footer">
        <input type="text" id="client-name" placeholder="Tu nombre">
        <div class="cart-total-box">
            <span>Total:</span>
            <span id="cart-total">$0</span>
        </div>
        <a href="#" class="btn-wa" onclick="sendWhatsApp()">PEDIR POR WHATSAPP</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
        authDomain: "express-market-868d9.firebaseapp.com",
        projectId: "express-market-868d9",
        storageBucket: "express-market-868d9.firebasestorage.app",
        messagingSenderId: "502987186701",
        appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let productosData = [];
    let carrito = [];

    function showToast(text) {
        const container = document.getElementById('toast-container');
        const card = document.createElement('div');
        card.className = 'toast-card';
        card.innerHTML = `<i class="fas fa-info-circle"></i> <span>${text}</span>`;
        container.appendChild(card);
        setTimeout(() => card.remove(), 3000);
    }

    onSnapshot(query(collection(db, "productos"), orderBy("fecha", "desc")), (snapshot) => {
        const container = document.getElementById('productos-container');
        container.innerHTML = ''; productosData = [];
        snapshot.forEach((doc) => {
            const p = { id: doc.id, ...doc.data() };
            productosData.push(p);
            const agotado = p.stock <= 0;
            container.innerHTML += `
                <div class="card">
                    <span class="stock-tag">${agotado ? 'AGOTADO' : 'Stock: ' + p.stock}</span>
                    <img src="${p.imagen}" onclick="openProduct('${p.id}')">
                    <div class="info">
                        <h3 onclick="openProduct('${p.id}')">${p.nombre}</h3>
                        <p class="price">$${Number(p.precio).toLocaleString()}</p>
                        <button class="btn-card-add" onclick="addToCart('${p.id}')" ${agotado ? 'disabled style="background:#ccc"' : ''}>
                            ${agotado ? 'SIN STOCK' : 'AÑADIR +'}
                        </button>
                    </div>
                </div>`;
        });
    });

    window.openProduct = (id) => {
        const p = productosData.find(item => item.id === id);
        const agotado = p.stock <= 0;
        document.getElementById('modal-data').innerHTML = `
            <img src="${p.imagen}" class="modal-img">
            <div class="modal-body">
                <h2>${p.nombre}</h2>
                <p style="color:#666; font-size:14px;">${p.descripcion || 'Sin descripción'}</p>
                <p class="price" style="font-size:24px;">$${Number(p.precio).toLocaleString()}</p>
                <button class="btn-card-add" style="width:100%; padding:15px;" onclick="addToCart('${p.id}')" ${agotado ? 'disabled' : ''}>AÑADIR AL CARRITO</button>
            </div>`;
        document.getElementById('product-modal').style.display = 'flex';
    };

    window.addToCart = (id) => {
        const p = productosData.find(item => item.id === id);
        const enCarrito = carrito.find(item => item.id === id);
        if (enCarrito) {
            if (enCarrito.cantidad < p.stock) enCarrito.cantidad++;
            else showToast("Stock máximo alcanzado");
        } else {
            carrito.push({ ...p, cantidad: 1 });
        }
        updateCartUI();
        if(document.getElementById('product-modal').style.display === 'flex') closeModal();
    };

    window.updateQty = (index, delta) => {
        const item = carrito[index];
        const p = productosData.find(prod => prod.id === item.id);
        if (delta > 0 && item.cantidad < p.stock) item.cantidad++;
        else if (delta < 0 && item.cantidad > 1) item.cantidad--;
        else if (delta < 0 && item.cantidad === 1) carrito.splice(index, 1);
        else if (delta > 0) showToast("No hay más stock disponible");
        updateCartUI();
    };

    function updateCartUI() {
        const list = document.getElementById('cart-items-list');
        const count = document.getElementById('cart-count');
        const totalEl = document.getElementById('cart-total');
        list.innerHTML = ''; let total = 0, cantTotal = 0;

        carrito.forEach((item, index) => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal; cantTotal += item.cantidad;
            list.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <span>${item.nombre}</span>
                        <span>$${subtotal.toLocaleString()}</span>
                    </div>
                    <div class="cart-item-controls">
                        <span class="unit-price">Precio un: $${Number(item.precio).toLocaleString()}</span>
                        <div class="qty-btns">
                            <button onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                </div>`;
        });
        count.innerText = cantTotal;
        totalEl.innerText = `$${total.toLocaleString()}`;
    }

    window.toggleCart = () => document.getElementById('cart-sidebar').classList.toggle('active');
    window.closeModal = () => document.getElementById('product-modal').style.display = 'none';

    window.sendWhatsApp = () => {
        const nombre = document.getElementById('client-name').value.trim();
        if (carrito.length === 0) { showToast("Carrito vacío"); return; }
        if (!nombre) { showToast("Escribe tu nombre"); return; }
        let msg = `🛍️ *PEDIDO EXPRESS MARKET*\n👤 *Cliente:* ${nombre}\n--------------------------\n`;
        let total = 0;
        carrito.forEach(item => {
            msg += `• ${item.nombre} (x${item.cantidad}) - $${(item.precio * item.cantidad).toLocaleString()}\n`;
            total += item.precio * item.cantidad;
        });
        msg += `--------------------------\n💰 *TOTAL: $${total.toLocaleString()}*`;
        window.open(`https://wa.me/573155445183?text=${encodeURIComponent(msg)}`, '_blank');
    };
</script>
</body>
</html>
