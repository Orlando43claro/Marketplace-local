<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas | Express Market</title>
    <link rel="icon" type="image/jpg" href="https://i.ibb.co/xS9z1Xhg/IMG-20260207-163949.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ff6b00; --oscuro: #232f3e; --gris: #f0f2f5; --verde: #25d366; --rojo: #d91e18; --azul: #2196F3; --oro: #ffb400; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding-top: 115px; }

        /* NAVBAR Y CATEGORÍAS */
        nav { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--oscuro); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1000; }
        .logo-nav { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--naranja); margin-right: 10px; object-fit: cover; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .btn-vender-top { background: var(--azul); color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 5px; }
        .cart-icon { color: white; position: relative; cursor: pointer; font-size: 22px; }
        #cart-count { position: absolute; top: -5px; right: -8px; background: var(--naranja); color: white; font-size: 11px; padding: 2px 6px; border-radius: 50%; }

        .cat-bar { position: fixed; top: 60px; left: 0; right: 0; background: white; display: flex; overflow-x: auto; padding: 10px; gap: 8px; z-index: 999; border-bottom: 1px solid #ddd; scrollbar-width: none; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-bar button { padding: 7px 15px; border-radius: 20px; border: 1px solid #ddd; background: #fff; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .cat-bar button.active { background: var(--naranja); color: #fff; border-color: var(--naranja); font-weight: bold; }

        /* GRID PRODUCTOS */
        .container { padding: 8px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #eee; position: relative; display: flex; flex-direction: column; transition: 0.3s; }
        
        .card-image-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 140px; background: #fff; }
        .card-image-slider::-webkit-scrollbar { display: none; }
        .card-image-slider img { min-width: 100%; width: 100%; height: 140px; object-fit: contain; scroll-snap-align: start; padding: 5px; box-sizing: border-box; cursor: pointer; }
        
        .card.agotado { opacity: 0.7; }
        .card.agotado .card-image-slider img { filter: grayscale(1); }

        .stock-tag { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 3px 7px; border-radius: 5px; z-index: 10; }
        .promo-badge { position: absolute; top: 5px; right: 5px; background: var(--rojo); color: white; font-size: 11px; padding: 4px 8px; border-radius: 8px; font-weight: bold; z-index: 10; }
        .external-badge { position: absolute; bottom: 5px; left: 5px; background: var(--azul); color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .scroll-hint { position: absolute; top: 115px; right: 5px; background: rgba(0,0,0,0.5); color: white; font-size: 8px; padding: 2px 5px; border-radius: 10px; z-index: 11; pointer-events: none; }

        .info { padding: 10px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0; font-size: 13px; color: var(--oscuro); height: 32px; overflow: hidden; cursor: pointer; }
        .price { font-size: 17px; font-weight: bold; color: var(--rojo); }
        .old-price { font-size: 12px; color: #888; text-decoration: line-through; margin-right: 5px; }

        .stars-mini { color: var(--oro); font-size: 10px; margin: 3px 0; cursor: pointer; }
        .stars-mini span { color: #999; font-size: 9px; margin-left: 3px; }

        .btn-card-add { background: var(--naranja); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-card-add:disabled { background: #888 !important; cursor: not-allowed; }

        /* MODAL */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 4000; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 380px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; animation: zoomIn 0.3s; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal { position: absolute; top: 12px; right: 12px; font-size: 22px; color: #333; cursor: pointer; z-index: 10; background: #eee; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-img { width: 100%; height: 230px; object-fit: contain; background: white; }
        
        .thumb-bar { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: #f9f9f9; border-bottom: 1px solid #eee; }
        .thumb-bar img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .thumb-bar img.active { border-color: var(--naranja); }

        /* ESTRELLAS VALORACIÓN MEJORADAS */
        .rating-input { display: flex; flex-direction: row-reverse; justify-content: center; gap: 10px; margin: 10px 0; }
        .rating-input input { display: none; }
        .rating-input label { font-size: 30px; color: #ccc; cursor: pointer; transition: 0.2s; }
        .rating-input input:checked ~ label, .rating-input label:hover, .rating-input label:hover ~ label { color: var(--oro); transform: scale(1.1); }

        .resena-item { border-bottom: 1px solid #f0f0f0; padding: 8px 0; animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .resena-nombre { font-weight: bold; font-size: 11px; color: var(--oscuro); margin-bottom: 2px; display: block; }

        /* CARRITO */
        #cart-sidebar { position: fixed; right: -100%; top: 0; width: 85%; max-width: 320px; height: 100%; background: white; z-index: 3000; transition: 0.4s; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.2); }
        #cart-sidebar.active { right: 0; }
        .cart-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .cart-items-list { flex: 1; overflow-y: auto; padding: 0 15px; }
        .cart-item { border-bottom: 1px solid #f0f0f0; padding: 15px 0; }
        .qty-btns { display: flex; align-items: center; gap: 15px; background: #f0f2f5; padding: 5px 12px; border-radius: 20px; }
        .qty-btns button { border: none; background: none; font-size: 18px; color: var(--naranja); font-weight: bold; cursor: pointer; }
        .cart-footer { padding: 20px; border-top: 1px solid #eee; background: #fff; }
        .btn-order { background: var(--naranja); color: white; border: none; display: block; text-align: center; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }

        #toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 5000; width: 90%; max-width: 320px; }
        .toast-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); border-left: 5px solid var(--verde); display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 8px; animation: slideDown 0.4s forwards; }
        @keyframes slideDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="toast-container"></div>
<a href="https://wa.me/573155445183" class="btn-soporte" target="_blank" style="position: fixed; bottom: 20px; right: 20px; background: var(--verde); color: white; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1500; text-decoration: none;"><i class="fab fa-whatsapp"></i></a>

<nav>
    <div style="display:flex; align-items:center;">
        <img src="https://i.ibb.co/xS9z1Xhg/IMG-20260207-163949.jpg" class="logo-nav">
        <span style="color:white; font-weight:bold; font-size:0.8rem;"> Marketplace</span>
    </div>
    <div class="nav-right">
        <a href="vender.html" class="btn-vender-top"><i class="fas fa-plus-circle"></i> VENDER</a>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </div>
</nav>

<div class="cat-bar" id="cat-bar">
    <button class="active" onclick="filterCat('Todos', this)">Todos</button>
    <button onclick="filterCat('Viveres', this)">Precios Bajos</button>
    <button onclick="filterCat('Aseo', this)">Variedades</button>
    <button onclick="filterCat('Bebidas', this)">⭐⭐⭐⭐⭐</button>
    <button onclick="filterCat('Externo', this)">📦 Externos</button>
    <button onclick="filterCat('Promociones', this)" style="color:red; font-weight:bold;">🔥 OFERTAS</button>
    <button onclick="filterCat('Usado', this)">Usado</button>
</div>

<div class="container">
    <div class="grid" id="productos-container"></div>
</div>

<div id="product-modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeModal()">×</span>
        <div id="modal-data"></div>
        
        <div class="modal-body" style="background:#fcfcfc; border-top: 1px solid #eee; padding: 15px;">
            <h5 style="margin:0 0 5px; font-size: 13px; color: #555;">Valorar producto</h5>
            <div class="rating-input">
                <input type="radio" id="s5" name="stars" value="5"><label for="s5">★</label>
                <input type="radio" id="s4" name="stars" value="4"><label for="s4">★</label>
                <input type="radio" id="s3" name="stars" value="3"><label for="s3">★</label>
                <input type="radio" id="s2" name="stars" value="2"><label for="s2">★</label>
                <input type="radio" id="s1" name="stars" value="1"><label for="s1">★</label>
            </div>
            <input type="text" id="review-user" placeholder="Tu nombre" style="width:100%; padding:8px; border-radius:8px; border:1px solid #ddd; font-size: 12px; box-sizing:border-box; margin-bottom: 5px;">
            <textarea id="review-text" placeholder="¿Qué te pareció?" style="width:100%; padding:8px; border-radius:8px; border:1px solid #ddd; font-size: 12px; box-sizing:border-box;" rows="2"></textarea>
            <div style="text-align: right;">
                <button id="btn-send-review" class="btn-card-add" style="width:auto; padding:6px 15px; font-size: 10px; margin-top:5px;">PUBLICAR</button>
            </div>
            <h5 style="margin:12px 0 8px; font-size: 13px; border-bottom: 2px solid var(--naranja); display:inline-block;">Opiniones</h5>
            <div id="reviews-container"></div>
        </div>
    </div>
</div>

<div id="cart-sidebar">
    <div class="cart-header">
        <h3 style="margin:0">Mi Pedido</h3>
        <span style="font-size:28px; cursor:pointer;" onclick="toggleCart()">×</span>
    </div>
    <div class="cart-items-list" id="cart-items-list"></div>
    <div class="cart-footer">
        <input type="text" id="client-name" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;" placeholder="Tu nombre">
        <input type="number" id="client-phone" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;" placeholder="Tu celular (WhatsApp)">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px; margin-bottom:15px;">
            <span>Total:</span><span id="cart-total">$0</span>
        </div>
        <button class="btn-order" onclick="crearPedido()">HACER PEDIDO</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, getDocs, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
        authDomain: "express-market-868d9.firebaseapp.com",
        projectId: "express-market-868d9",
        storageBucket: "express-market-868d9.firebasestorage.app",
        messagingSenderId: "502987186701",
        appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allProducts = [];
    let carrito = [];
    let currentCat = "Todos";
    let selectedProdId = null;

    function showToast(text, color = "var(--verde)") {
        const container = document.getElementById('toast-container');
        const card = document.createElement('div');
        card.className = 'toast-card';
        card.style.borderLeftColor = color;
        card.innerHTML = `<i class="fas ${color === 'var(--rojo)' ? 'fa-exclamation-circle' : 'fa-check-circle'}" style="color:${color};"></i> <span>${text}</span>`;
        container.appendChild(card);
        setTimeout(() => { card.style.opacity = '0'; setTimeout(() => card.remove(), 500); }, 3000);
    }

    onSnapshot(query(collection(db, "productos"), orderBy("fecha", "desc")), (snapshot) => {
        allProducts = [];
        snapshot.forEach(doc => allProducts.push({id: doc.id, ...doc.data()}));
        renderProducts();
    });

    window.filterCat = (cat, btn) => {
        currentCat = cat;
        document.querySelectorAll('.cat-bar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts();
    };

    function renderProducts() {
        const container = document.getElementById('productos-container');
        container.innerHTML = '';
        const filtered = currentCat === "Todos" ? allProducts : allProducts.filter(p => p.categoria === currentCat);
        
        filtered.forEach(p => {
            const stockNum = Number(p.stock) || 0;
            const agotado = stockNum <= 0;
            const tienePromo = p.precioOld > p.precio;
            let dcto = tienePromo ? Math.round(((p.precioOld - p.precio) / p.precioOld) * 100) : 0;
            
            const fotos = p.imagenes && p.imagenes.length > 0 ? p.imagenes : [p.imagen];
            let sliderHtml = `<div class="card-image-slider">`;
            fotos.forEach(f => {
                sliderHtml += `<img src="${f}" onclick="openProduct('${p.id}')" loading="lazy">`;
            });
            sliderHtml += `</div>`;

            container.innerHTML += `
                <div class="card ${agotado ? 'agotado' : ''}">
                    ${p.waVendedor ? `<span class="external-badge">EXTERNO</span>` : ''}
                    ${tienePromo ? `<span class="promo-badge">-${dcto}%</span>` : ''}
                    <span class="stock-tag" style="${agotado ? 'background:var(--rojo)' : ''}">
                        ${agotado ? '¡AGOTADO!' : 'Stock: ' + stockNum}
                    </span>
                    ${fotos.length > 1 ? `<span class="scroll-hint"><i class="fas fa-images"></i> Desliza</span>` : ''}
                    ${sliderHtml}
                    <div class="info">
                        <h3 onclick="openProduct('${p.id}')">${p.nombre}</h3>
                        <div class="stars-mini" onclick="openProduct('${p.id}')">
                            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                            <span>(Opiniones)</span>
                        </div>
                        <div class="price-container">
                            ${tienePromo ? `<span class="old-price">$${Number(p.precioOld).toLocaleString()}</span>` : ''}
                            <span class="price">$${Number(p.precio).toLocaleString()}</span>
                        </div>
                        <button class="btn-card-add" onclick="addToCart('${p.id}')" ${agotado ? 'disabled' : ''}>
                            AÑADIR +
                        </button>
                    </div>
                </div>`;
        });
    }

    window.openProduct = async (id) => {
        selectedProdId = id;
        const p = allProducts.find(item => item.id === id);
        const stockNum = Number(p.stock) || 0;
        const agotado = stockNum <= 0;
        const tienePromo = p.precioOld > p.precio;
        const fotos = p.imagenes && p.imagenes.length > 0 ? p.imagenes : [p.imagen];
        
        let galeriaHtml = `<img src="${fotos[0]}" class="modal-img" id="main-modal-img">`;
        if(fotos.length > 1) {
            galeriaHtml += `<div class="thumb-bar">`;
            fotos.forEach((f) => {
                galeriaHtml += `<img src="${f}" onclick="document.getElementById('main-modal-img').src='${f}'">`;
            });
            galeriaHtml += `</div>`;
        }

        document.getElementById('modal-data').innerHTML = `
            ${galeriaHtml}
            <div class="modal-body" style="padding:15px; padding-bottom:5px;">
                <h2 style="margin:0; font-size:18px;">${p.nombre}</h2>
                <div class="price-container" style="text-align:left; margin:8px 0;">
                    ${tienePromo ? `<span class="old-price" style="font-size:14px;">$${Number(p.precioOld).toLocaleString()}</span>` : ''}
                    <span class="price" style="font-size:22px;">$${Number(p.precio).toLocaleString()}</span>
                </div>
                <p style="color:#666; font-size:13px; margin-bottom:15px;">${p.descripcion || 'Sin descripción.'}</p>
                <button class="btn-card-add" style="width:100%; padding:12px; font-size:15px;" 
                    onclick="addToCart('${p.id}'); closeModal();" ${agotado ? 'disabled' : ''}>
                    ${agotado ? 'AGOTADO' : 'AGREGAR AL PEDIDO'}
                </button>
            </div>`;
        
        document.getElementById('product-modal').style.display = 'flex';
        loadReviews(id);
    };

    window.closeModal = (e) => {
        if(!e || e.target.id === 'product-modal' || e.target.className === 'close-modal') {
            document.getElementById('product-modal').style.display = 'none';
            selectedProdId = null;
        }
    };

    async function loadReviews(prodId) {
        if(!prodId) return;
        const container = document.getElementById('reviews-container');
        container.innerHTML = '<p style="font-size:10px; color:#999;">Cargando...</p>';
        try {
            const q = query(collection(db, "resenas"), where("idProducto", "==", prodId));
            const snapshot = await getDocs(q);
            container.innerHTML = '';
            if(snapshot.empty) {
                container.innerHTML = '<p style="font-size:10px; color:#bbb; text-align:center;">Sin opiniones aún.</p>';
                return;
            }
            let reviews = [];
            snapshot.forEach(doc => reviews.push(doc.data()));
            
            // ORDENAR POR FECHA: MÁS RECIENTES PRIMERO
            reviews.sort((a, b) => {
                const fechaA = a.fecha?.seconds || 0;
                const fechaB = b.fecha?.seconds || 0;
                return fechaB - fechaA;
            });

            reviews.forEach(r => {
                container.innerHTML += `
                    <div class="resena-item">
                        <span class="resena-nombre">${r.nombreUsuario || 'Anónimo'}</span>
                        <div style="color:var(--oro); font-size:9px;">${'★'.repeat(r.estrellas)}${'☆'.repeat(5-r.estrellas)}</div>
                        <p style="margin:2px 0; font-size:12px; color:#444;">${r.comentario}</p>
                    </div>`;
            });
        } catch(e) { container.innerHTML = '<p style="font-size:10px; color:red;">Error.</p>'; }
    }

    document.getElementById('btn-send-review').onclick = async () => {
        const estrellasInput = document.querySelector('input[name="stars"]:checked');
        const usuarioInput = document.getElementById('review-user');
        const textoInput = document.getElementById('review-text');
        const btn = document.getElementById('btn-send-review');

        if(!estrellasInput || !usuarioInput.value.trim() || !textoInput.value.trim() || !selectedProdId) { 
            showToast("Completa todos los campos", "var(--rojo)"); return; 
        }

        btn.disabled = true; btn.innerText = "...";
        try {
            await addDoc(collection(db, "resenas"), {
                idProducto: selectedProdId, 
                nombreUsuario: usuarioInput.value.trim(),
                estrellas: Number(estrellasInput.value), 
                comentario: textoInput.value.trim(), 
                fecha: serverTimestamp()
            });
            // LIMPIAR CAMPOS
            usuarioInput.value = '';
            textoInput.value = '';
            document.querySelectorAll('input[name="stars"]').forEach(i => i.checked = false);
            
            showToast("¡Reseña publicada!");
            setTimeout(() => { loadReviews(selectedProdId); }, 500);
        } catch(e) { showToast("Error al guardar", "var(--rojo)"); } 
        finally { btn.disabled = false; btn.innerText = "PUBLICAR"; }
    };

    window.addToCart = (id) => {
        const p = allProducts.find(item => item.id === id);
        const stockReal = Number(p.stock) || 0;
        if(stockReal <= 0) { showToast("Agotado", "var(--rojo)"); return; }
        const enCarrito = carrito.find(item => item.id === id);
        if (enCarrito) {
            if (enCarrito.cantidad < stockReal) { enCarrito.cantidad++; showToast("Agregado"); }
            else showToast("Stock agotado en tienda", "var(--rojo)");
        } else {
            carrito.push({ ...p, cantidad: 1 });
            showToast("Agregado");
        }
        updateCartUI();
    };

    window.updateQty = (index, delta) => {
        const item = carrito[index];
        const p = allProducts.find(prod => prod.id === item.id);
        const stockReal = Number(p.stock) || 0;
        if (delta > 0) {
             if(item.cantidad < stockReal) item.cantidad++;
             else showToast("Stock agotado", "var(--rojo)");
        } else {
            if (item.cantidad > 1) item.cantidad--;
            else carrito.splice(index, 1);
        }
        updateCartUI();
    };

    function updateCartUI() {
        const list = document.getElementById('cart-items-list');
        const count = document.getElementById('cart-count');
        const totalEl = document.getElementById('cart-total');
        list.innerHTML = ''; let total = 0, cantTotal = 0;
        carrito.forEach((item, index) => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal; cantTotal += item.cantidad;
            list.innerHTML += `
                <div class="cart-item">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:14px;">
                        <span>${item.nombre}</span>
                        <span>$${subtotal.toLocaleString()}</span>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
                        <span style="font-size:11px; color:#888;">$${item.precio.toLocaleString()} c/u</span>
                        <div class="qty-btns">
                            <button onclick="updateQty(${index}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                </div>`;
        });
        count.innerText = cantTotal;
        totalEl.innerText = `$${total.toLocaleString()}`;
    }

    window.toggleCart = () => document.getElementById('cart-sidebar').classList.toggle('active');

    window.crearPedido = async () => {
        const nombre = document.getElementById('client-name').value.trim();
        const telefono = document.getElementById('client-phone').value.trim();
        if (carrito.length === 0 || !nombre || !telefono) { showToast("Faltan datos", "var(--rojo)"); return; }
        try {
            let totalPedido = 0;
            carrito.forEach(item => totalPedido += (item.precio * item.cantidad));
            const pedidoData = {
                cliente: nombre, telefono: telefono, total: totalPedido, fecha: serverTimestamp(),
                items: carrito.map(item => ({
                    nombre: item.nombre, cantidad: item.cantidad, precio: item.precio,
                    waVendedor: item.waVendedor || "", notificado: false
                }))
            };
            await addDoc(collection(db, "pedidos"), pedidoData);
            carrito = []; updateCartUI(); toggleCart();
            document.getElementById('client-name').value = "";
            document.getElementById('client-phone').value = "";
            showToast("¡Pedido enviado!");
        } catch (e) { showToast("Error", "var(--rojo)"); }
    };
</script>
</body>
</html>
