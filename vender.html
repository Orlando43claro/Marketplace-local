<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socio YaMi | Panel Único</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/flash-on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ff6b00; --oscuro: #232f3e; --gris: #f0f2f5; --verde: #25d366; --azul: #2196f3; --rojo: #ff4444; --oro: #ffb100; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding: 20px; }
        
        .view { display: none; max-width: 400px; margin: auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .yami-icon { background: var(--naranja); color: white; width: 45px; height: 45px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; transform: rotate(-10deg); font-weight: bold; }
        
        h2 { text-align: center; color: var(--oscuro); font-size: 1.2rem; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: 800; color: #94a3b8; display: block; margin-top: 10px; margin-left: 5px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0 15px; border: 1.5px solid #edf2f7; border-radius: 12px; box-sizing: border-box; background: #f8fafc; font-size: 14px; outline: none; transition: 0.3s; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-naranja { background: var(--naranja); color: white; box-shadow: 0 4px 15px rgba(255,107,0,0.2); }
        .btn-logout { background: #fee2e2; color: var(--rojo); padding: 8px 12px; width: auto; font-size: 11px; font-weight: 800; border-radius: 10px; border: none; cursor: pointer; }

        /* BADGES */
        .badge-plan { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 900; margin-left: 5px; text-transform: uppercase; vertical-align: middle; }
        .gratis-tag { background: #e2e8f0; color: #64748b; }
        .pro-tag { background: var(--oro); color: var(--oscuro); box-shadow: 0 0 10px rgba(255, 177, 0, 0.4); }

        /* MODAL DE CONFIRMACIÓN */
        .modal-confirm { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .modal-card { background: white; padding: 25px; border-radius: 25px; max-width: 320px; text-align: center; animation: popUp 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* BANNER DE BLOQUEO */
        #pay-banner { display: none; background: linear-gradient(135deg, #232f3e, #445566); color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; border: 2px solid var(--oro); }
        .btn-pay { background: var(--oro); color: var(--oscuro); margin-top: 15px; text-decoration: none; display: block; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 13px; }

        .prod-card { background: white; padding: 12px; border-radius: 18px; margin-top: 12px; display: flex; gap: 12px; align-items: center; border: 1px solid #eee; }
        .prod-card img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 9999; display: none; font-weight: bold; font-size: 13px; border-left: 5px solid var(--naranja); }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="confirm-del-modal" class="modal-confirm">
    <div class="modal-card">
        <div style="font-size: 50px; color: var(--rojo); margin-bottom: 15px;"><i class="fas fa-trash-alt"></i></div>
        <h3 style="margin:0; font-size: 18px; color: var(--oscuro);">¿Borrar producto?</h3>
        <p style="font-size: 14px; color: #64748b; margin: 10px 0;">Esta acción no se puede deshacer.</p>
        <button class="btn btn-naranja" id="confirm-yes" style="background: var(--rojo); margin-bottom: 10px;">SÍ, BORRAR AHORA</button>
        <button class="btn" style="background: var(--gris); color: var(--oscuro);" onclick="cerrarModalDel()">CANCELAR</button>
    </div>
</div>

<div id="view-login" class="view">
    <div class="card">
        <div class="logo-container"><div class="yami-icon"><i class="fas fa-bolt"></i></div><h1 style="margin:5px 0; font-size:24px;">YaMi Socios</h1></div>
        <h2>Ingresa a tu Tienda</h2>
        <label>WhatsApp</label><input type="number" id="log-wa" placeholder="3155445183">
        <label>Código</label><input type="password" id="log-code" maxlength="4" placeholder="****">
        <button class="btn btn-naranja" onclick="login()">ENTRAR AL PANEL</button>
        <button class="btn" style="background:none; color:var(--azul); margin-top:10px;" onclick="switchView('view-register')">¿No tienes cuenta? Regístrate</button>
    </div>
</div>

<div id="view-register" class="view">
    <div class="card">
        <h2>Únete a YaMi</h2>
        <label>Nombre Tienda</label><input type="text" id="reg-tienda" placeholder="Ej: Pizza YaMi">
        <label>WhatsApp</label><input type="number" id="reg-wa" placeholder="3155445183">
        <label>Código (4 dígitos)</label><input type="password" id="reg-code" maxlength="4">
        <button class="btn btn-naranja" onclick="registrarSocio()">CREAR MI PERFIL</button>
        <button class="btn" style="background:none; color:var(--azul); margin-top:10px;" onclick="switchView('view-login')">Ya soy socio</button>
    </div>
</div>

<div id="view-vender" class="view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div><span id="header-tienda" style="font-weight: 900; color: var(--oscuro); font-size: 17px;">Cargando...</span><span id="plan-badge" class="badge-plan"></span></div>
        <button class="btn-logout" onclick="logout()">SALIR</button>
    </div>

    <div id="pay-banner">
        <div style="font-size: 40px; margin-bottom: 10px;">🚀</div>
        <h3 style="margin:0;">¡Límite Gratis Alcanzado!</h3>
        <p style="font-size: 12px; margin: 10px 0;">Has publicado los 3 productos permitidos. La edición y nuevas publicaciones están bloqueadas.</p>
        <a id="link-pago-wa" href="#" target="_blank" class="btn-pay"><i class="fab fa-whatsapp"></i> ACTIVAR PLAN PRO POR MES</a>
    </div>

    <div class="card" id="form-card">
        <h2 id="form-title">Publicar Producto</h2>
        <input type="hidden" id="edit-id">
        <label>Nombre</label><input type="text" id="p-nombre">
        <div style="display: flex; gap: 10px;">
            <div style="flex:1"><label>Precio</label><input type="number" id="p-precio"></div>
            <div style="flex:1"><label>Stock</label><input type="number" id="p-stock"></div>
        </div>
        <label>Categoría</label><select id="p-categoria"><option value="Externo">Cargando...</option></select>
        <label>Descripción</label><textarea id="p-desc" rows="2"></textarea>
        <label>Link Foto (ImgBB)</label><input type="text" id="p-url">
        <button id="btn-main" class="btn btn-naranja" onclick="guardarProducto()">SUBIR A YAMI</button>
    </div>

    <div id="inventario" style="margin-top: 30px;">
        <h3 style="font-size: 14px; text-align: center; color: var(--oscuro); font-weight: 800;"><i class="fas fa-box-open"></i> MI INVENTARIO</h3>
        <div id="lista-productos"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, serverTimestamp, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
        authDomain: "express-market-868d9.firebaseapp.com",
        projectId: "express-market-868d9",
        storageBucket: "express-market-868d9.firebasestorage.app",
        messagingSenderId: "502987186701",
        appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let sesion = JSON.parse(localStorage.getItem('vendedorActual'));
    let planActual = "gratis";
    let totalProds = 0;
    let idParaBorrar = null;

    window.switchView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    };

    function notify(text) {
        const t = document.getElementById('toast');
        t.innerText = text; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // --- SESIÓN ---
    window.registrarSocio = async () => {
        const t = document.getElementById('reg-tienda').value.trim();
        const w = document.getElementById('reg-wa').value.trim();
        const c = document.getElementById('reg-code').value.trim();
        if(!t || !w || !c) return notify("Faltan datos");
        await addDoc(collection(db, "socios"), { nombreTienda: t, celular: w, codigo: c, plan: "gratis", fecha: serverTimestamp() });
        sesion = { celular: w, tienda: t };
        localStorage.setItem('vendedorActual', JSON.stringify(sesion));
        initPanel();
    };

    window.login = async () => {
        const w = document.getElementById('log-wa').value.trim();
        const c = document.getElementById('log-code').value.trim();
        const snap = await getDocs(query(collection(db, "socios"), where("celular", "==", w)));
        let user = null;
        snap.forEach(d => { if(d.data().codigo == c) user = d.data(); });
        if(user) {
            sesion = { celular: w, tienda: user.nombreTienda };
            localStorage.setItem('vendedorActual', JSON.stringify(sesion));
            initPanel();
        } else notify("Datos incorrectos");
    };

    window.logout = () => { localStorage.removeItem('vendedorActual'); window.location.href = 'index.html'; };

    // --- PANEL ---
    function initPanel() {
        switchView('view-vender');
        onSnapshot(query(collection(db, "socios"), where("celular", "==", sesion.celular)), (snap) => {
            snap.forEach(doc => {
                const data = doc.data();
                planActual = data.plan || "gratis";
                const esPro = planActual === "pro";
                document.getElementById('header-tienda').innerHTML = `${esPro ? '👑 ' : ''}${data.nombreTienda}`;
                const badge = document.getElementById('plan-badge');
                badge.innerText = esPro ? "Socio PRO" : "Gratis";
                badge.className = `badge-plan ${esPro ? 'pro-tag' : 'gratis-tag'}`;
                verificarBloqueo();
            });
        });

        onSnapshot(query(collection(db, "productos"), where("waVendedor", "==", sesion.celular)), (snap) => {
            totalProds = snap.size;
            renderInventario(snap);
            verificarBloqueo();
        });
    }

    function verificarBloqueo() {
        const banner = document.getElementById('pay-banner');
        const form = document.getElementById('form-card');
        const msj = encodeURIComponent(`Hola YaMi, ya tengo 3 productos y quiero activar el Plan PRO para mi tienda: ${sesion.tienda}`);
        document.getElementById('link-pago-wa').href = `https://wa.me/3155445183?text=${msj}`;

        if(planActual === "gratis" && totalProds >= 3) {
            banner.style.display = 'block'; form.style.display = 'none';
        } else {
            banner.style.display = 'none'; form.style.display = 'block';
        }
    }

    window.guardarProducto = async () => {
        const idEdit = document.getElementById('edit-id').value;
        const btn = document.getElementById('btn-main');
        const urlInput = document.getElementById('p-url').value.trim();
        if(!urlInput) return notify("Link de foto obligatorio");
        
        const datos = {
            nombre: document.getElementById('p-nombre').value,
            precio: Number(document.getElementById('p-precio').value),
            stock: Number(document.getElementById('p-stock').value),
            descripcion: document.getElementById('p-desc').value,
            imagenes: urlInput.split(','), imagen: urlInput.split(',')[0],
            waVendedor: sesion.celular, nombreTienda: sesion.tienda,
            estado: "pendiente", categoria: document.getElementById('p-categoria').value,
            fecha: serverTimestamp()
        };

        btn.disabled = true;
        try {
            if(idEdit) await updateDoc(doc(db, "productos", idEdit), datos);
            else await addDoc(collection(db, "productos"), datos);
            notify("¡Guardado exitoso!");
            resetForm();
        } catch(e) { notify("Error al guardar"); }
        btn.disabled = false;
    };

    function renderInventario(snap) {
        const lista = document.getElementById('lista-productos');
        lista.innerHTML = '';
        snap.forEach(d => {
            const p = d.data();
            const bloqueoEdicion = (planActual === "gratis" && totalProds >= 3);
            lista.innerHTML += `
                <div class="prod-card">
                    <img src="${p.imagen}">
                    <div style="flex:1">
                        <b style="font-size:13px;">${p.nombre}</b><br>
                        <small style="color:var(--naranja); font-weight:800;">$${Number(p.precio).toLocaleString()}</small>
                    </div>
                    ${!bloqueoEdicion ? `
                        <button onclick="window.prepararEdit('${d.id}', '${p.nombre}', ${p.precio}, ${p.stock}, '${p.descripcion}', '${p.imagenes.join(',')}', '${p.categoria}')" style="border:none; background:none; color:var(--azul); font-size:18px;"><i class="fas fa-edit"></i></button>
                    ` : '<i class="fas fa-lock" style="color:#ccc; margin-right:10px;"></i>'}
                    <button onclick="window.abrirModalDel('${d.id}')" style="border:none; background:none; color:var(--rojo); font-size:18px;"><i class="fas fa-trash"></i></button>
                </div>`;
        });
    }

    // --- LÓGICA DE BORRADO ---
    window.abrirModalDel = (id) => {
        idParaBorrar = id;
        document.getElementById('confirm-del-modal').style.display = 'flex';
    };

    window.cerrarModalDel = () => {
        idParaBorrar = null;
        document.getElementById('confirm-del-modal').style.display = 'none';
    };

    document.getElementById('confirm-yes').onclick = async () => {
        if(idParaBorrar) {
            await deleteDoc(doc(db, "productos", idParaBorrar));
            cerrarModalDel();
            notify("Producto borrado satisfactoriamente");
        }
    };

    window.prepararEdit = (id, n, p, s, d, imgs, cat) => {
        document.getElementById('edit-id').value = id;
        document.getElementById('p-nombre').value = n;
        document.getElementById('p-precio').value = p;
        document.getElementById('p-stock').value = s;
        document.getElementById('p-desc').value = d;
        document.getElementById('p-url').value = imgs;
        document.getElementById('p-categoria').value = cat;
        document.getElementById('form-title').innerText = "Editando";
        document.getElementById('btn-main').innerText = "GUARDAR CAMBIOS";
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    function resetForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerText = "Publicar Producto";
        document.querySelectorAll('#view-vender input, #view-vender textarea').forEach(i => i.value = '');
    }

    onSnapshot(query(collection(db, "categorias"), orderBy("fecha", "asc")), (snap) => {
        const sel = document.getElementById('p-categoria');
        if(!sel) return;
        sel.innerHTML = '<option value="Externo">Seleccionar Categoría</option>';
        snap.forEach(d => { sel.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; });
    });

    if(sesion) initPanel(); else switchView('view-login');
</script>
</body>
</html>
