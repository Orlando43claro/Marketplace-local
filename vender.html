<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socio YaMi | Panel Único</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/flash-on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ff6b00; --oscuro: #232f3e; --gris: #f0f2f5; --verde: #25d366; --azul: #2196f3; --rojo: #ff4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding: 20px; }
        
        .view { display: none; max-width: 400px; margin: auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .yami-icon { background: var(--naranja); color: white; width: 45px; height: 45px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; transform: rotate(-10deg); font-weight: bold; }
        
        h2 { text-align: center; color: var(--oscuro); font-size: 1.2rem; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: 800; color: #94a3b8; display: block; margin-top: 10px; margin-left: 5px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0 15px; border: 1.5px solid #edf2f7; border-radius: 12px; box-sizing: border-box; background: #f8fafc; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--naranja); background: white; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-naranja { background: var(--naranja); color: white; box-shadow: 0 4px 15px rgba(255,107,0,0.2); }
        .btn-logout { background: #fee2e2; color: var(--rojo); padding: 8px 12px; width: auto; font-size: 11px; font-weight: 800; border-radius: 10px; border: none; cursor: pointer; }

        .prod-card { background: white; padding: 12px; border-radius: 18px; margin-top: 12px; display: flex; gap: 12px; align-items: center; border: 1px solid #eee; }
        .prod-card img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 9999; display: none; font-weight: bold; font-size: 13px; border-left: 5px solid var(--naranja); }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="modal-bienvenida" class="modal">
    <div class="card" style="max-width:350px; text-align:center;">
        <div class="yami-icon" style="margin-bottom:15px;"><i class="fas fa-rocket"></i></div>
        <h2 style="color:var(--naranja); margin-top:0;">¡Bienvenido Socio!</h2>
        <p style="font-size:14px; color:#444; line-height:1.5;">Tu perfil ha sido creado. Antes de publicar, recuerda:</p>
        <div style="background:#f0f7ff; padding:15px; border-radius:15px; text-align:left; margin-bottom:20px;">
            <p style="font-size:13px; margin:0;">
                <i class="fas fa-camera" style="color:var(--azul);"></i> <b>Fotos:</b> Sube tus fotos a <b>ImgBB</b> y pega aquí el "Enlace directo".<br><br>
                <i class="fas fa-link" style="color:var(--azul);"></i> <b>Varios:</b> Separa los links con una coma (,).
            </p>
        </div>
        <button class="btn btn-naranja" onclick="cerrarBienvenida()">¡ENTENDIDO, A VENDER!</button>
    </div>
</div>

<div id="view-login" class="view">
    <div class="card">
        <div class="logo-container">
            <div class="yami-icon"><i class="fas fa-bolt"></i></div>
            <h1 style="margin: 5px 0; font-size: 24px;">YaMi Socios</h1>
        </div>
        <h2>Ingresa a tu Tienda</h2>
        <label>WhatsApp</label>
        <input type="number" id="log-wa" placeholder="Ej: 573123456789">
        <label>Código de 4 dígitos</label>
        <input type="password" id="log-code" maxlength="4" placeholder="****">
        <button class="btn btn-naranja" onclick="login()">ENTRAR AL PANEL</button>
        <button class="btn" style="background:none; color:var(--azul); margin-top:10px;" onclick="switchView('view-register')">¿No tienes cuenta? Regístrate</button>
    </div>
</div>

<div id="view-register" class="view">
    <div class="card">
        <h2>Únete como Socio</h2>
        <label>Nombre de tu Tienda</label>
        <input type="text" id="reg-tienda" placeholder="Ej: Hamburguesas el Socio">
        <label>WhatsApp</label>
        <input type="number" id="reg-wa" placeholder="Ej: 573123456789">
        <label>Crea un Código (4 dígitos)</label>
        <input type="password" id="reg-code" maxlength="4" placeholder="Ej: 1234">
        <button class="btn btn-naranja" onclick="registrarSocio()">CREAR MI PERFIL</button>
        <button class="btn" style="background:none; color:var(--azul); margin-top:10px;" onclick="switchView('view-login')">Ya soy socio</button>
    </div>
</div>

<div id="view-vender" class="view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span id="header-tienda" style="font-weight: 900; color: var(--oscuro); font-size: 18px;">🛒 Mi Tienda</span>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> SALIR</button>
    </div>

    <div class="card">
        <h2 id="form-title" style="margin-bottom:10px;">Publicar Producto</h2>
        <input type="hidden" id="edit-id">
        
        <label>Nombre del Producto</label>
        <input type="text" id="p-nombre" placeholder="¿Qué vendes hoy?">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex:1">
                <label>Precio Hoy ($)</label>
                <input type="number" id="p-precio" placeholder="15000">
            </div>
            <div style="flex:1">
                <label>Stock</label>
                <input type="number" id="p-stock" placeholder="10">
            </div>
        </div>

        <label>Categoría</label>
        <select id="p-categoria" required>
            <option value="">Seleccionar...</option>
        </select>
        
        <label>Descripción Corta</label>
        <textarea id="p-desc" rows="2" placeholder="Detalles, ingredientes, etc."></textarea>
        
        <label>Links de Fotos (ImgBB)</label>
        <input type="text" id="p-url" placeholder="link1, link2...">
        
        <button id="btn-main" class="btn btn-naranja" onclick="guardarProducto()">SUBIR A YAMI</button>
    </div>

    <div id="inventario" style="margin-top: 30px;">
        <h3 style="font-size: 14px; text-align: center; color: var(--oscuro); font-weight: 800;"><i class="fas fa-box-open"></i> MI INVENTARIO</h3>
        <div id="lista-productos"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, serverTimestamp, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
        authDomain: "express-market-868d9.firebaseapp.com",
        projectId: "express-market-868d9",
        storageBucket: "express-market-868d9.firebasestorage.app",
        messagingSenderId: "502987186701",
        appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let sesion = JSON.parse(localStorage.getItem('vendedorActual'));

    // --- CARGAR CATEGORÍAS EN EL SELECT ---
    onSnapshot(query(collection(db, "categorias"), orderBy("fecha", "asc")), (snapshot) => {
        const select = document.getElementById('p-categoria');
        select.innerHTML = '<option value="">Seleccionar...</option>';
        snapshot.forEach(docSnap => {
            const cat = docSnap.data().nombre;
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
    });

    // --- NAVEGACIÓN ---
    window.switchView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    };

    function notify(text) {
        const t = document.getElementById('toast');
        t.innerText = text; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    window.logout = () => {
        localStorage.removeItem('vendedorActual');
        notify("Cerrando sesión... Volviendo a la tienda");
        setTimeout(() => { window.location.href = 'index.html'; }, 600);
    };

    window.registrarSocio = async () => {
        const tienda = document.getElementById('reg-tienda').value.trim();
        const wa = document.getElementById('reg-wa').value.trim();
        const code = document.getElementById('reg-code').value.trim();
        if(!tienda || !wa || !code) return notify("Faltan datos");
        try {
            await addDoc(collection(db, "socios"), { nombreTienda: tienda, celular: wa, codigo: code });
            sesion = { celular: wa, tienda: tienda };
            localStorage.setItem('vendedorActual', JSON.stringify(sesion));
            document.getElementById('modal-bienvenida').style.display = 'flex';
        } catch(e) { notify("Error al registrar"); }
    };

    window.cerrarBienvenida = () => {
        document.getElementById('modal-bienvenida').style.display = 'none';
        initPanel();
    };

    window.login = async () => {
        const wa = document.getElementById('log-wa').value.trim();
        const code = document.getElementById('log-code').value.trim();
        if(!wa || !code) return notify("Escribe tus datos");
        const q = query(collection(db, "socios"), where("celular", "==", wa));
        const snap = await getDocs(q);
        let valid = false;
        snap.forEach(d => {
            if(d.data().codigo == code) {
                sesion = { celular: wa, tienda: d.data().nombreTienda };
                localStorage.setItem('vendedorActual', JSON.stringify(sesion));
                valid = true;
            }
        });
        if(valid) initPanel(); else notify("Datos incorrectos");
    };

    function initPanel() {
        switchView('view-vender');
        document.getElementById('header-tienda').innerText = "🛒 " + sesion.tienda;
        renderInventario();
    }

    window.guardarProducto = async () => {
        const idEdit = document.getElementById('edit-id').value;
        const urlInput = document.getElementById('p-url').value.trim();
        const catInput = document.getElementById('p-categoria').value;
        
        if(!urlInput) return notify("Pega el link de la foto");
        if(!catInput) return notify("Elige una categoría");
        
        const urls = urlInput.split(',').map(u => u.trim());
        const btn = document.getElementById('btn-main');

        const datos = {
            nombre: document.getElementById('p-nombre').value,
            precio: Number(document.getElementById('p-precio').value),
            stock: Number(document.getElementById('p-stock').value),
            descripcion: document.getElementById('p-desc').value,
            imagenes: urls,
            imagen: urls[0],
            waVendedor: sesion.celular,
            nombreTienda: sesion.tienda,
            estado: "pendiente",
            categoria: catInput, // Ahora usa el valor del SELECT
            fecha: serverTimestamp()
        };

        btn.disabled = true;
        try {
            if(idEdit) await updateDoc(doc(db, "productos", idEdit), datos);
            else await addDoc(collection(db, "productos"), datos);
            notify("¡Producto guardado!");
            resetForm();
            renderInventario();
        } catch(e) { notify("Error al guardar"); }
        btn.disabled = false;
    };

    async function renderInventario() {
        const q = query(collection(db, "productos"), where("waVendedor", "==", sesion.celular));
        const snap = await getDocs(q);
        const lista = document.getElementById('lista-productos');
        lista.innerHTML = '';
        snap.forEach(d => {
            const p = d.data();
            lista.innerHTML += `
                <div class="prod-card">
                    <img src="${p.imagen}">
                    <div style="flex:1">
                        <b style="font-size:13px;">${p.nombre}</b><br>
                        <small style="color:var(--naranja); font-weight:800;">$${Number(p.precio).toLocaleString()}</small>
                        <br><span style="font-size:10px; background:#eee; padding:2px 5px; border-radius:4px;">${p.categoria}</span>
                    </div>
                    <button onclick="window.prepararEdit('${d.id}', '${p.nombre}', ${p.precio}, ${p.stock}, '${p.descripcion}', '${p.imagenes.join(',')}', '${p.categoria}')" style="border:none; background:none; color:var(--azul); font-size:18px;"><i class="fas fa-edit"></i></button>
                    <button onclick="window.eliminar('${d.id}')" style="border:none; background:none; color:var(--rojo); font-size:18px;"><i class="fas fa-trash"></i></button>
                </div>`;
        });
    }

    window.prepararEdit = (id, n, p, s, d, imgs, cat) => {
        document.getElementById('edit-id').value = id;
        document.getElementById('p-nombre').value = n;
        document.getElementById('p-precio').value = p;
        document.getElementById('p-stock').value = s;
        document.getElementById('p-desc').value = d;
        document.getElementById('p-url').value = imgs;
        document.getElementById('p-categoria').value = cat;
        document.getElementById('form-title').innerText = "Editando Producto";
        document.getElementById('btn-main').innerText = "GUARDAR CAMBIOS";
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.eliminar = async (id) => {
        if(confirm("¿Seguro que quieres borrar este producto?")) {
            await deleteDoc(doc(db, "productos", id));
            renderInventario();
            notify("Producto eliminado");
        }
    };

    function resetForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerText = "Publicar Producto";
        document.getElementById('btn-main').innerText = "SUBIR A YAMI";
        document.querySelectorAll('#view-vender input, #view-vender textarea, #view-vender select').forEach(i => i.value = '');
    }

    if(sesion) initPanel(); else switchView('view-login');

</script>
</body>
</html>
